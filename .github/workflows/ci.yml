name: CI/CD

# Триггера pull_request нет намеренно: этот репозиторий — одностороннее зеркало
# монорепо, код приезжает только через `git subtree push --prefix=server`.
# Слитый здесь PR сломал бы следующий subtree push — он перестал бы быть
# fast-forward. Вести разработку тут всё равно негде.
# workflow_dispatch оставлен, чтобы можно было передеплоить без нового коммита.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Два пуша подряд не деплоят одновременно: второй прогон встаёт в очередь и
# ждёт, пока закончится первый. cancel-in-progress выключен намеренно —
# прервать деплой между `alembic upgrade` и `systemctl restart` хуже, чем
# подождать минуту. GitHub держит в очереди один ожидающий прогон: из трёх
# быстрых пушей задеплоится последний, промежуточный отменится сам.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sayr
          POSTGRES_PASSWORD: sayr
          POSTGRES_DB: sayr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayr -d sayr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Ровно те переменные, которые читает tests/conftest.py
      SAYR_DATABASE_URL: postgresql+psycopg://sayr:sayr@localhost:5432/sayr_test
      SAYR_MEDIA_DIR: ${{ runner.temp }}/sayr-media
      # Пустышки. Настоящих секретов в тестовом job'е нет и быть не должно.
      # Но без этих двух переменных app/config.py падает на импорте — так задумано
      SAYR_ADMIN_PASSWORD: ci-only-not-a-secret
      SAYR_SECRET_KEY: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.12
        # В образе раннера свой Python, но requires-python = ">=3.12",
        # и на сервере интерпретатор тоже ставит uv — держим одинаково
        run: uv python install "$PYTHON_VERSION"

      - name: Зависимости
        # --frozen: если uv.lock разошёлся с pyproject.toml, падаем здесь.
        # На сервере update.sh выполняет ровно ту же команду, так что
        # рассинхрон лучше поймать до деплоя, а не во время.
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

      - name: Миграции, сверка схемы и сид на чистой базе
        # Тесты поднимают схему через Base.metadata.create_all и alembic не
        # трогают вообще. На сервере схему катает alembic — значит сломанная
        # миграция прошла бы тесты и легла бы на прод. Проверяем отдельно,
        # на пустой базе, тем же путём, что и в бою:
        #   upgrade head — миграции вообще накатываются;
        #   alembic check — итоговая схема совпадает с models.py. Без него
        #     расхождение вида «в модели index=True, в миграции его нет»
        #     доезжает до прода незамеченным — ровно такое уже было в 0006;
        #   seed.seed — правки в seed/data/places.json не ломают импорт.
        # Базу создаём через psycopg, а не psql: он и так в зависимостях,
        # а наличие psql на раннере — не контракт
        env:
          SAYR_DATABASE_URL: postgresql+psycopg://sayr:sayr@localhost:5432/sayr_migrations
        run: |
          uv run python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://sayr:sayr@localhost:5432/postgres", autocommit=True
          ) as conn:
              conn.execute("DROP DATABASE IF EXISTS sayr_migrations")
              conn.execute("CREATE DATABASE sayr_migrations OWNER sayr")
          PY
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m seed.seed

  deploy:
    name: Деплой на VPS
    needs: test
    # Только main. Ручной запуск из main тоже деплоит — это единственный
    # способ передеплоить без нового коммита
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Худший путь: uv sync с пустым кэшем + дамп + миграции + 40 с ожидания
    # healthz + откат (ещё один sync и ещё 40 с). Таймаут короче этого пути
    # оборвал бы ssh ровно посреди деплоя
    timeout-minutes: 25

    steps:
      - name: Ключ в ssh-agent
        # webfactory/ssh-agent, а не appleboy/ssh-action: это крошечный
        # JS-action, приватный ключ живёт только в памяти агента и не
        # ложится в файл внутри workspace. appleboy — docker-action, тянет
        # образ (плюс ~20 с к каждому прогону) и прячет ssh за своими
        # параметрами; здесь вся полезная нагрузка — одна удалённая
        # команда, прятать нечего.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Отпечаток сервера
        # Без known_hosts осталось бы StrictHostKeyChecking=no, то есть
        # деплой кому угодно, кто перехватит DNS/маршрут.
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Обновить и проверить
        # Скрипт лежит в /usr/local/sbin, а не внутри каталога приложения,
        # который сам же перезаписывается git-пуллом.
        # В authorized_keys сервера на этот ключ навешена forced command с той
        # же строкой: даже если ключ утечёт, им нельзя сделать ничего, кроме
        # этого деплоя — ни шелла, ни произвольной команды.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=20 \
              "$SSH_USER@$SSH_HOST" \
              '/usr/local/sbin/sayr-update'

      - name: Публичный /healthz
        # Необязательно. Задай переменную (не секрет) PUBLIC_BASE_URL вида
        # https://sayr.duckdns.org в Settings → Variables, и деплой заодно
        # проверит, что снаружи через nginx всё тоже отвечает: сертификат жив,
        # proxy_pass настроен. Внутренний healthz это не ловит.
        if: vars.PUBLIC_BASE_URL != ''
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --max-time 15 "$PUBLIC_BASE_URL/healthz"
