# Боевой запуск: docker compose -f compose.prod.yml up -d --build
# Переменные берутся из .env рядом с этим файлом (см. .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sayr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-sayr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не публикуем: приложение ходит по внутренней сети compose.
    # docker publish обходит ufw, так что открытый 5432 фаервол бы не закрыл
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sayr} -d ${POSTGRES_DB:-sayr}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Фото и GPX, залитые через админку, живут здесь. Без тома они пропадут
      # при пересоздании контейнера
      - media:/app/media
    ports:
      # Только на локальный интерфейс — наружу отдаёт reverse proxy с TLS
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

volumes:
  pgdata:
  media:
