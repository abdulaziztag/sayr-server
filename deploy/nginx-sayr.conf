# /etc/nginx/sites-available/sayr — включается симлинком в sites-enabled.
# Строки TLS дописывает certbot: certbot --nginx -d ЗАМЕНИ.duckdns.org
#
# На сервере nginx уже обслуживает другие сайты, поэтому проверять конфиг
# обязательно: nginx -t && systemctl reload nginx. Именно reload, не restart —
# restart уронил бы соседние сайты на время перезапуска.

server {
    listen 80;
    listen [::]:80;
    server_name ЗАМЕНИ.duckdns.org;

    # Фото через админку загружаются целиком в теле запроса; дефолтный
    # лимит nginx в 1 МБ обрезал бы их
    client_max_body_size 20m;

    # /media отдаёт само приложение, а не nginx с диска: код лежит в /root,
    # который закрыт (0700), и www-data туда не заглянет. Статики немного,
    # uvicorn с ней справляется
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без этого заголовка приложение считает соединение незашифрованным
        # и cookie админки с Secure не установится
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
