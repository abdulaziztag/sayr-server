# /etc/nginx/sites-available/sayr — включается симлинком в sites-enabled.
#
# Это СНИМОК боевого конфига (сверен 24 августа 2026), а не заготовка.
# Раньше здесь лежал исходный вариант без TLS и с одним именем; раскатка
# из него положила бы sayr.info вместе с сертификатом.
#
# Строки «managed by Certbot» дописал сам certbot:
#   certbot --nginx -d sayr.duckdns.org -d sayr.info -d www.sayr.info
# Сертификат один на три имени, лежит по пути с именем sayr.duckdns.org —
# так вышло исторически, это нормально и переименования не требует.
#
# На сервере nginx уже обслуживает чужие боевые сайты, поэтому проверять
# конфиг обязательно: nginx -t && systemctl reload nginx. Именно reload,
# не restart — restart уронил бы соседние сайты на время перезапуска.
#
# Лимиты частоты (limit_req) дописаны 29 сентября поверх снимка; после
# копирования на сервер файл снова совпадает с боевым.

# Файл nginx включает внутрь http {}, поэтому зоны и map стоят здесь, вне
# server. Имена с префиксом sayr_: зоны и переменные map на сервере общие
# для всех сайтов, а сайты там чужие.
#
# Считаются только запросы, которые что-то меняют: у GET и HEAD ключ
# пустой, а пустой ключ limit_req не учитывает. Страницу входа или форму
# можно обновлять сколько угодно, отправлять — нет.
map $request_method $sayr_limit_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}

# Вход по номеру: каждый код — платное сообщение через шлюз Telegram.
# У приложения свои счётчики на номер и адрес, но они в памяти каждого
# воркера и обнуляются деплоем; здесь поток отсекается до приложения
limit_req_zone $sayr_limit_key zone=sayr_auth:1m rate=6r/m;
# Пароли админки и страницы проверки сезонов — от перебора
limit_req_zone $sayr_limit_key zone=sayr_login:1m rate=3r/m;
# Открытые формы: обращения с файлами (/report) и запись в тестеры
limit_req_zone $sayr_limit_key zone=sayr_forms:1m rate=3r/m;
# Телеметрия приложений: события и токены пушей. Щедрее остальных: за одним
# адресом мобильного оператора (NAT) бывают сотни телефонов, и шлют они это
# сами, без участия человека
limit_req_zone $sayr_limit_key zone=sayr_api:5m rate=60r/m;
# «Пойду» и голос за темп — нажатия людей. Своя зона, а не общая
# с телеметрией: иначе события чужих телефонов за тем же NAT съедали бы
# лимит, и кнопка отвечала бы ошибкой тому, кто нажал её один раз
limit_req_zone $sayr_limit_key zone=sayr_intents:1m rate=20r/m;

server {
    server_name sayr.duckdns.org sayr.info www.sayr.info;

    # Фото через админку загружаются целиком в теле запроса; дефолтный
    # лимит nginx в 1 МБ обрезал бы их
    client_max_body_size 20m;

    # Сверх лимита — 429, а не 503 по умолчанию: 503 выглядел бы упавшим
    # сервером и в журналах, и в мониторинге
    limit_req_status 429;

    # /media отдаёт само приложение, а не nginx с диска: код лежит в /root,
    # который закрыт (0700), и www-data туда не заглянет. Статики немного,
    # uvicorn с ней справляется
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без этого заголовка приложение считает соединение незашифрованным
        # и cookie админки с Secure не установится
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Ниже — то же проксирование, что у location /, плюс limit_req.
    # Набор proxy_set_header повторён целиком намеренно: соседние location
    # его друг у друга не наследуют, а без X-Forwarded-Proto не встала бы
    # cookie админки.

    # Вход по номеру. Бурст — на человека: запрос кода, пара попыток ввода
    # и «отправить ещё раз» через минуту
    location /api/v1/auth/ {
        limit_req zone=sayr_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Отчёты шлюза о доставке приходят с адресов Telegram, одних на всех
    # наших людей сразу. Под лимит входа их не ставим: срезанный отчёт
    # не погасил бы недоставленную заявку. Ручку и так закрывает ключ в адресе
    location = /api/v1/auth/callback/telegram {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location ~ ^/(admin/login|seasons/review/login)$ {
        limit_req zone=sayr_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location ~ ^/(report|android-testers)$ {
        limit_req zone=sayr_forms burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location ~ ^/api/v1/(events|push/devices(/[^/]+)?)$ {
        limit_req zone=sayr_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location ~ ^/api/v1/places/[^/]+/(intents|pace)$ {
        limit_req zone=sayr_intents burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sayr.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sayr.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


# Простой HTTP. Certbot завёл этот блок, когда имя было одно, и при
# расширении сертификата новые имена сюда не дописал: http://sayr.info
# отдавал 404 вместо перехода на https. Ссылка без схемы — в посте,
# в QR-коде, продиктованная вслух — вела в никуда.
server {
    if ($host = sayr.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sayr.info) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.sayr.info) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name sayr.duckdns.org sayr.info www.sayr.info;
    return 404; # managed by Certbot
}
