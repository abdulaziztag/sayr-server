[project]
name = "sayr-server"
version = "0.1.0"
description = "Sayr API — каталог природных мест Узбекистана"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx[http2]>=0.27",
    "pillow>=10.3",
    "sqladmin>=0.18",
    "fastapi-storages>=0.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
